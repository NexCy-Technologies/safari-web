<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e6a46" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3f8c5d" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="noise" x="0" y="0">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#g)" opacity="0.12"/>
  <g stroke="#3f8c5d" stroke-width="0.4" stroke-opacity="0.35">
    <!-- Stylized leaf shapes -->
    <path d="M40 60 C55 30,85 30,100 60 C85 90,55 90,40 60Z"/>
    <path d="M180 120 C195 90,225 90,240 120 C225 150,195 150,180 120Z"/>
    <path d="M300 80 C315 50,345 50,360 80 C345 110,315 110,300 80Z"/>
    <path d="M120 220 C135 190,165 190,180 220 C165 250,135 250,120 220Z"/>
    <path d="M260 260 C275 230,305 230,320 260 C305 290,275 290,260 260Z"/>
    <path d="M60 300 C75 270,105 270,120 300 C105 330,75 330,60 300Z"/>
    <path d="M200 340 C215 310,245 310,260 340 C245 370,215 370,200 340Z"/>
  </g>
  <rect width="400" height="400" filter="url(#noise)" opacity="0.12" />
</svg>